[project]
name = "qwen-ppo-tuning"
version = "0.1.0"
description = "PPO fine-tuning for Qwen 1.5B using torchtune"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Suyash Harlalka", email = "harlalkasuyash@gmail.com" }
]
keywords = ["deep-learning", "pytorch", "transformers", "ppo", "rlhf", "qwen", "torchtune"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base dependencies (PyTorch installed separately based on GPU availability)
dependencies = [
    # Core ML & Data
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    # Transformers & HuggingFace
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    # Fine-tuning & RLHF
    "peft>=0.13.0",
    "trl>=0.12.0,<0.23.0",
    "torchtune",
    "torchao",
    # Experiment Tracking
    "wandb>=0.18.0",
    "tensorboard>=2.18.0",
    "mlflow>=2.19.0",
    # Utilities
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    # Data Formats
    "pyarrow>=18.0.0",
]

[project.urls]
Repository = "https://github.com/suyashh94/qwen-ppo-tuning"

# Uncomment and customize CLI entry points as needed
# [project.scripts]
# train = "qwen_ppo_tuning.cli:train"
# eval = "qwen_ppo_tuning.cli:evaluate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_ppo_tuning"]

# Development dependencies using dependency-groups (modern uv approach)
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "ipython>=8.29.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]
unfixable = [
    "F401",   # unused imports - don't auto-remove on save
]

[tool.ruff.lint.isort]
known-first-party = ["qwen_ppo_tuning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "torchaudio.*",
    "torchtune.*",
    "transformers.*",
    "datasets.*",
    "wandb.*",
    "sklearn.*",
    "mlflow.*",
    "accelerate.*",
    "tensorboard.*",
    "peft.*",
    "trl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
